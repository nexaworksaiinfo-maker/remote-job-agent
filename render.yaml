version: "1"
services:
  # PostgreSQL Database
  - type: pserv
    name: remote-job-agent-db
    plan: free
    region: oregon
    databaseName: remote_job_agent
    user: remote_job_agent
    version: "16"
    ipAllowList: []

  # Redis
  - type: redis
    name: remote-job-agent-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys_lru

  # API (Web Service)
  - type: web
    name: remote-job-agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remote-job-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: LINKEDIN_EMAIL
        value: "mdsabbirulalam@gmail.com"
      - key: LINKEDIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OLLAMA_BASE_URL
        value: "http://ollama-server:11434/v1"
      - key: OLLAMA_MODEL
        value: "llama3.1:70b"
      - key: OLLAMA_EMBEDDING_MODEL
        value: "nomic-embed-text"
      - key: USE_OLLAMA_FOR_CHAT
        value: "true"
      - key: USE_OLLAMA_FOR_EMBEDDINGS
        value: "true"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "mdsabbirulalam@gmail.com"
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: "noreply@remotejobagent.com"
      - key: EMAIL_FROM_NAME
        value: "Remote Job Agent"
      - key: MATCH_THRESHOLD
        value: "0.65"
      - key: MAX_DAILY_APPLICATIONS
        value: "20"
      - key: MAX_CONCURRENT_APPLICATIONS
        value: "3"
      - key: AUTO_APPLY_ENABLED
        value: "true"
      - key: AUTO_APPLY_MIN_MATCH_SCORE
        value: "0.65"
      - key: FEATURE_JOB_SCRAPING
        value: "true"
      - key: FEATURE_JOB_MATCHING
        value: "true"
      - key: FEATURE_AUTO_APPLY
        value: "true"
      - key: FEATURE_TELEGRAM_BOT
        value: "true"
      - key: FEATURE_EMAIL_ALERTS
        value: "true"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: PLAYWRIGHT_SLOW_MO
        value: "100"
      - key: PLAYWRIGHT_TIMEOUT
        value: "60000"
      - key: ENVIRONMENT
        value: "production"
    autoDeploy: true
    numInstances: 1

  # Scraper Worker
  - type: worker
    name: remote-job-agent-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    startCommand: celery -A app.core.celery worker -Q scrapers -c 2 --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remote-job-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LINKEDIN_EMAIL
        value: "mdsabbirulalam@gmail.com"
      - key: LINKEDIN_PASSWORD
        sync: false
      - key: OLLAMA_BASE_URL
        value: "http://ollama-server:11434/v1"
      - key: OLLAMA_MODEL
        value: "llama3.1:70b"
      - key: USE_OLLAMA_FOR_CHAT
        value: "true"
      - key: USE_OLLAMA_FOR_EMBEDDINGS
        value: "true"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: PLAYWRIGHT_SLOW_MO
        value: "100"
      - key: PLAYWRIGHT_TIMEOUT
        value: "120000"
    autoDeploy: true
    numInstances: 1

  # Matcher Worker
  - type: worker
    name: remote-job-agent-matcher
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    startCommand: celery -A app.core.celery worker -Q matchers -c 2 --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remote-job-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: "http://ollama-server:11434/v1"
      - key: OLLAMA_MODEL
        value: "llama3.1:70b"
      - key: USE_OLLAMA_FOR_CHAT
        value: "true"
      - key: USE_OLLAMA_FOR_EMBEDDINGS
        value: "true"
    autoDeploy: true
    numInstances: 1

  # Applier Worker (Standard plan for Playwright)
  - type: worker
    name: remote-job-agent-applier
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: standard
    startCommand: celery -A app.core.celery worker -Q applications -c 1 --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remote-job-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LINKEDIN_EMAIL
        value: "mdsabbirulalam@gmail.com"
      - key: LINKEDIN_PASSWORD
        sync: false
      - key: OLLAMA_BASE_URL
        value: "http://ollama-server:11434/v1"
      - key: OLLAMA_MODEL
        value: "llama3.1:70b"
      - key: USE_OLLAMA_FOR_CHAT
        value: "true"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: PLAYWRIGHT_SLOW_MO
        value: "200"
      - key: PLAYWRIGHT_TIMEOUT
        value: "120000"
    autoDeploy: true
    numInstances: 1

  # Notifications Worker
  - type: worker
    name: remote-job-agent-notifications
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    startCommand: celery -A app.core.celery worker -Q notifications -c 2 --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remote-job-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "mdsabbirulalam@gmail.com"
      - key: SMTP_PASSWORD
        sync: false
      - key: OLLAMA_BASE_URL
        value: "http://ollama-server:11434/v1"
      - key: OLLAMA_MODEL
        value: "llama3.1:70b"
      - key: USE_OLLAMA_FOR_CHAT
        value: "true"
      - key: USE_OLLAMA_FOR_EMBEDDINGS
        value: "true"
    autoDeploy: true
    numInstances: 1

  # Celery Beat (Cron Job)
  - type: cron
    name: remote-job-agent-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    schedule: "*/15 * * * *"
    startCommand: celery -A app.core.celery beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remote-job-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: remote-job-agent-redis
          property: connectionString
    autoDeploy: true
    numInstances: 1

  # Ollama Server
  - type: web
    name: ollama-server
    runtime: docker
    dockerfilePath: ./Dockerfile.ollama
    region: oregon
    plan: standard
    startCommand: serve
    envVars:
      - key: OLLAMA_MODELS
        value: "llama3.1:70b"
    autoDeploy: true
    numInstances: 1
    healthCheckPath: /api/tags